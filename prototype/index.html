<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f1115"><title>ABPlayer</title>
<style>
:root{--bg:#0f1115;--s:#191c22;--e:#232731;--text:#f4f6fa;--muted:#9ca3af;--line:#303641;--a:#72a9ff;--good:#76d7a0;--warn:#f2c66d;--r:12px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}button,input,select{font:inherit}button{border:0;color:inherit;cursor:pointer}.app{height:100vh;display:grid;grid-template-columns:72px 1fr 72px;background:var(--bg)}.edge{display:flex;align-items:center;justify-content:center;background:#12151a;border-color:var(--line);z-index:4}.edge.left{border-right:1px solid var(--line)}.edge.right{border-left:1px solid var(--line)}.edge button{width:100%;height:100%;background:transparent;color:var(--muted);font-size:25px}.edge button:hover{color:var(--a);background:#181d25}.hint{position:absolute;bottom:18px;color:#677181;font-size:10px;writing-mode:vertical-rl;letter-spacing:.08em}.viewport{position:relative;min-width:0;overflow:hidden}.screen{position:absolute;inset:0;overflow:auto;padding:24px clamp(18px,4vw,56px) 105px;transition:transform .28s ease,opacity .28s}.screen.player{transform:translateX(0)}.screen.management{transform:translateX(-105%);opacity:0}.screen.files{transform:translateX(105%);opacity:0}.show-left .player{transform:translateX(105%);opacity:0}.show-left .management{transform:translateX(0);opacity:1}.show-right .player{transform:translateX(-105%);opacity:0}.show-right .files{transform:translateX(0);opacity:1}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.title{margin:0;font-size:24px;letter-spacing:-.03em}.sub{color:var(--muted);font-size:12px}.actions{display:flex;align-items:center;gap:8px}.icon,.btn{min-height:38px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--s);color:var(--text)}.icon{width:38px;padding:0}.btn:hover,.icon:hover{border-color:var(--a)}.primary{border-color:transparent;background:var(--a);color:#07101f}.card{border:1px solid var(--line);border-radius:var(--r);background:var(--s)}.player-grid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(260px,1fr);gap:18px;max-width:1120px;margin:auto}.art-panel{display:flex;align-items:center;justify-content:center;min-height:500px;padding:24px;border-radius:var(--r);background:linear-gradient(145deg,#202b3d,#15181e);position:relative;overflow:hidden}.art-panel:after{content:"";position:absolute;width:360px;height:360px;border-radius:50%;background:#72a9ff25;filter:blur(40px);top:-90px;right:-80px}.art{display:grid;place-items:center;width:min(76%,390px);aspect-ratio:1;border-radius:18px;z-index:1;background:linear-gradient(145deg,#385d9a,#151d2c 65%);box-shadow:0 25px 50px #0008;font-size:100px;color:#dceaff}.details{display:flex;flex-direction:column;justify-content:center;padding:24px}.eyebrow{color:var(--a);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.track-title{margin:7px 0 2px;font-size:30px;line-height:1.1}.artist{color:var(--muted);font-size:16px}.metadata{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0;color:var(--muted);font-size:12px}.chip{padding:5px 8px;border-radius:6px;background:var(--e)}.seek{height:8px;margin:18px 0 7px;border-radius:10px;background:#343b48;cursor:pointer}.seek i{display:block;width:0;height:100%;border-radius:inherit;background:var(--a)}.times{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.controls{display:flex;align-items:center;justify-content:center;gap:9px;margin:22px 0}.control{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:transparent;color:var(--text);font-size:18px}.control:hover,.control.active{background:var(--e);color:var(--a)}.control.main{width:58px;height:58px;background:var(--a);color:#07101f;font-size:24px}.secondary{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.secondary button{padding:8px 10px;border-radius:8px;background:var(--e);color:var(--muted)}.secondary button:hover{color:var(--text)}.volume{display:flex;align-items:center;gap:10px;margin-top:20px;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--a)}.section{max-width:1050px;margin:0 auto 18px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}.playlist-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.playlist{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--s);cursor:pointer}.playlist:hover,.playlist.selected{border-color:var(--a);background:#1c2635}.thumb{display:grid;place-items:center;width:45px;height:45px;flex:none;border-radius:8px;background:#293b5c;color:var(--a);font-size:20px}.playlist strong{display:block}.playlist .sub{display:block;margin-top:3px}.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.setting{display:flex;align-items:center;justify-content:space-between;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--s)}.setting label{display:block}.setting small{display:block;margin-top:3px;color:var(--muted)}.switch{width:40px;height:23px;border-radius:20px;background:#3a414c;padding:3px}.switch i{display:block;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s}.switch.on{background:var(--a)}.switch.on i{transform:translateX(17px)}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.search{min-width:180px;flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--s);color:var(--text);outline:0}.search:focus{border-color:var(--a)}.track{display:grid;grid-template-columns:36px minmax(0,1fr) 190px 70px 40px;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}.track:hover,.track.current{background:#202936}.track:last-child{border:0}.num{color:var(--muted);text-align:center}.name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{background:transparent;color:var(--muted);font-size:18px}.empty{padding:55px 20px;text-align:center;color:var(--muted)}.bottom{position:fixed;right:72px;bottom:0;left:72px;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;padding:10px 18px;border-top:1px solid var(--line);background:#15191fee;backdrop-filter:blur(16px)}.mini{display:flex;align-items:center;gap:10px;min-width:0}.mini-art{display:grid;place-items:center;width:45px;height:45px;border-radius:7px;background:#293b5c;color:var(--a)}.mini-title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bottom .controls{margin:0}.bottom .volume{justify-content:flex-end;margin:0}.dialog{position:fixed;z-index:20;inset:0;display:none;place-items:center;background:#0009}.dialog.open{display:grid}.dialog-box{width:min(440px,calc(100% - 30px));padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--e)}.dialog-box h3{margin:0 0 15px}.dialog-box input,.dialog-box select{width:100%;margin:6px 0 13px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--s);color:var(--text)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;z-index:30;right:20px;bottom:105px;padding:11px 15px;border:1px solid #536984;border-radius:9px;background:#233249;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:800px){.app{grid-template-columns:45px 1fr 45px}.bottom{right:45px;left:45px;grid-template-columns:1fr auto}.bottom .volume{display:none}.player-grid{grid-template-columns:1fr}.art-panel{min-height:290px}.art{width:230px}.track{grid-template-columns:28px minmax(0,1fr) 35px}.track .meta.album,.track .duration{display:none}}@media(max-width:500px){.screen{padding:16px 12px 105px}.title{font-size:21px}.track-title{font-size:24px}.details{padding:15px}.art-panel{min-height:235px}.art{width:190px}.secondary button{font-size:12px}.bottom{padding:8px 10px}.bottom .control:not(.main){display:none}}
@media(prefers-reduced-motion:reduce){.screen{transition:none}}
</style>
</head>
<body>
<div class="app" id="app"><aside class="edge left"><button id="leftBtn" aria-label="Настройки и плейлисты">‹</button><span class="hint">ПРОВЕДИТЕ ВПРАВО</span></aside><div class="viewport" id="viewport">
<section class="screen management" id="management"><header class="top"><div><h1 class="title">Библиотека и плейлисты</h1><span class="sub">Управление коллекцией</span></div><div class="actions"><button class="icon" id="newPlaylist" aria-label="Создать плейлист">＋</button><button class="icon" id="manageSearch">⌕</button></div></header><div class="section"><div class="section-head"><strong>Плейлисты</strong><span class="sub" id="playlistCount"></span></div><div class="playlist-list" id="playlists"></div></div><div class="section"><div class="section-head"><strong>Настройки воспроизведения</strong></div><div class="settings" id="settings"></div></div></section>
<section class="screen player" id="player"><header class="top"><div><h1 class="title">ABPlayer</h1><span class="sub" id="currentPlaylist">Избранное</span></div><div class="actions"><button class="icon" id="artButton">◈</button><button class="icon" id="playerMenu">⋮</button></div></header><div class="player-grid"><div class="card art-panel"><div class="art">♫</div></div><div class="card details"><div class="eyebrow" id="status">Готов к воспроизведению</div><div class="track-title" id="nowTitle">Выберите трек</div><div class="artist" id="nowArtist">ABPlayer</div><div class="metadata"><span class="chip" id="genre">Без трека</span><span class="chip" id="year">—</span><span class="chip" id="format">—</span></div><div class="seek" id="seek"><i></i></div><div class="times"><span id="elapsed">00:00</span><span id="total">00:00</span></div><div class="controls"><button class="control" id="rewind" title="Назад">↶</button><button class="control" id="previous">◀</button><button class="control main" id="play">▶</button><button class="control" id="forward" title="Вперёд">↷</button><button class="control" id="next">▶</button></div><div class="controls"><button class="control" id="shuffle" title="Случайный порядок">⤨</button><button class="control" id="repeat" title="Повтор">↻</button><button class="control" id="favorite">♡</button><button class="control" id="bookmark">🔖</button><button class="control" id="ab">A↔B</button><button class="control" id="queue">☷</button></div><div class="secondary"><button id="speed">1×</button><button id="pitch">Тон 0</button><button id="eq">Эквалайзер</button><button id="sleep">Таймер сна</button></div><div class="volume">⌁<input id="volume" type="range" min="0" max="100" value="72"><span id="volumeText">72%</span></div></div></div></section>
<section class="screen files" id="files"><header class="top"><div><h1 class="title" id="filesTitle">Избранное</h1><span class="sub" id="filesSummary">0 треков</span></div><div class="actions"><button class="icon" id="filesMenu">⋮</button></div></header><div class="toolbar"><input class="search" id="trackSearch" placeholder="Поиск по плейлисту"><button class="btn" id="sort">Сортировка: название</button><button class="btn" id="group">Группировка</button><button class="btn primary" id="shufflePlay">⤨ Играть случайно</button><button class="btn" id="addFiles">＋ Файлы</button></div><div class="card" id="fileList"></div></section>
</div><aside class="edge right"><button id="rightBtn" aria-label="Файлы плейлиста">›</button><span class="hint">ПРОВЕДИТЕ ВЛЕВО</span></aside></div>
<footer class="bottom"><div class="mini"><div class="mini-art">♫</div><div style="min-width:0"><div class="mini-title" id="miniTitle">Выберите трек</div><div class="sub" id="miniArtist">ABPlayer</div></div></div><div class="controls"><button class="control" id="bottomPrev">◀</button><button class="control main" id="bottomPlay">▶</button><button class="control" id="bottomNext">▶</button></div><div class="volume">⌁<input id="bottomVolume" type="range" min="0" max="100" value="72"></div></footer>
<input id="audioFiles" type="file" multiple accept="audio/*,.mp3,.m4a,.flac,.ogg,.wav" hidden><input id="folderFiles" type="file" webkitdirectory multiple accept="audio/*" hidden><div class="dialog" id="dialog"><div class="dialog-box"><h3 id="dialogHeading">Создать плейлист</h3><label>Название<input id="dialogInput" placeholder="Например, В дорогу"></label><div class="dialog-actions"><button class="btn" id="dialogCancel">Отмена</button><button class="btn primary" id="dialogConfirm">Создать</button></div></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const app=$('#app'),audio=new Audio();audio.preload='metadata';let screen='player',playlists=[{name:'Избранное',favorite:true,tracks:[]},{name:'Недавно добавленные',tracks:[]}],selected=0,index=-1,shuffle=false,repeat='off',sortMode='title',grouped=false,abStart=null,abEnd=null,objectUrls=[];
const settingsData=[['Восстановить позицию','Продолжить с последнего места',true],['Предзагрузка следующего трека','Быстрое переключение',true],['Плавное начало и конец','Fade in / fade out',true],['Crossfade','Смешивание соседних треков',false],['Нормализация громкости','ReplayGain на лету',true],['Автопауза между треками','Пауза перед следующим',false],['Автоповорот экрана','Следовать ориентации устройства',true],['Жест: встряхнуть','Переключить на следующий трек',false]];
function say(t){const x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove('show'),2200)}function current(){return playlists[selected]}function fmt(v){return isFinite(v)?`${String(Math.floor(v/60)).padStart(2,'0')}:${String(Math.floor(v%60)).padStart(2,'0')}`:'00:00'}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function navigate(to){screen=to;app.classList.toggle('show-left',to==='management');app.classList.toggle('show-right',to==='files');if(to==='files')renderFiles();if(to==='management')renderManagement()}
function renderManagement(){$('#playlistCount').textContent=`${playlists.length} плейлиста`;$('#playlists').innerHTML=playlists.map((p,i)=>`<div class="playlist ${i===selected?'selected':''}" data-playlist="${i}"><div class="thumb">${p.favorite?'♡':'♫'}</div><div><strong>${esc(p.name)}</strong><span class="sub">${p.tracks.length} треков · ${p.tracks.reduce((a,t)=>a+(t.duration||0),0)?fmt(p.tracks.reduce((a,t)=>a+(t.duration||0),0)):'—'}</span></div></div>`).join('');$$('[data-playlist]').forEach(x=>x.onclick=()=>{selected=+x.dataset.playlist;index=-1;$('#currentPlaylist').textContent=current().name;renderManagement();renderFiles();say(`Открыт плейлист «${current().name}»`)});$('#settings').innerHTML=settingsData.map((s,i)=>`<div class="setting"><div><label>${s[0]}</label><small>${s[1]}</small></div><button class="switch ${s[2]?'on':''}" data-setting="${i}"><i></i></button></div>`).join('');$$('[data-setting]').forEach(x=>x.onclick=()=>{x.classList.toggle('on');say('Настройка сохранена')})}
function renderFiles(){const p=current(),q=$('#trackSearch').value.toLowerCase();let list=p.tracks.map((t,i)=>({...t,i})).filter(t=>`${t.title} ${t.artist} ${t.album}`.toLowerCase().includes(q));list.sort((a,b)=>sortMode==='random'?Math.random()-.5:String(a.title).localeCompare(b.title));$('#filesTitle').textContent=p.name;$('#filesSummary').textContent=`${p.tracks.length} треков · ${fmt(p.tracks.reduce((a,t)=>a+(t.duration||0),0))}`;$('#fileList').innerHTML=list.length?list.map(t=>`<div class="track ${t.i===index?'current':''}" data-index="${t.i}"><span class="num">${t.i===index?'▶':String(t.i+1).padStart(2,'0')}</span><div><div class="name">${esc(t.title)}</div><div class="meta">${esc(t.artist)} · ${esc(t.album||'Локальный файл')}</div></div><span class="meta album">${esc(t.genre||'Музыка')}</span><span class="meta duration">${fmt(t.duration)}</span><button class="more" data-more="${t.i}">⋮</button></div>`).join(''):'<div class="empty">Плейлист пуст<br><br><button class="btn primary" id="emptyAdd">Добавить файлы</button></div>';$$('[data-index]').forEach(x=>x.onclick=e=>{if(e.target.dataset.more!==undefined){say('Меню трека: очередь · избранное · закладка · удалить');return}playAt(+x.dataset.index)});$('#emptyAdd')?.addEventListener('click',()=>$('#audioFiles').click())}
function addFiles(files){const p=current();[...files].filter(f=>f.type.startsWith('audio/')||/\.(mp3|m4a|flac|ogg|wav|aac)$/i.test(f.name)).forEach(f=>{const u=URL.createObjectURL(f);objectUrls.push(u);p.tracks.push({title:f.name.replace(/\.[^.]+$/,''),artist:'Неизвестный исполнитель',album:'Локальный файл',genre:'Музыка',url:u,file:f,duration:0})});renderFiles();renderManagement();say(`Добавлено файлов: ${files.length}`)}
function playAt(i){const p=current(),t=p.tracks[i];if(!t)return;index=i;audio.src=t.url;audio.play().catch(()=>{});$('#nowTitle').textContent=t.title;$('#nowArtist').textContent=t.artist;$('#miniTitle').textContent=t.title;$('#miniArtist').textContent=t.artist;$('#status').textContent='Воспроизведение';$('#genre').textContent=t.genre||'Музыка';$('#format').textContent=t.file?.name.split('.').pop().toUpperCase()||'STREAM';$('#play').textContent='Ⅱ';$('#bottomPlay').textContent='Ⅱ';renderFiles()}
function next(){const p=current();if(!p.tracks.length)return;let n=shuffle?Math.floor(Math.random()*p.tracks.length):(index+1)%p.tracks.length;if(repeat==='off'&&index===p.tracks.length-1&&!shuffle){audio.pause();return}playAt(n)}function prev(){if(audio.currentTime>4){audio.currentTime=0;return}const p=current();if(p.tracks.length)playAt((index-1+p.tracks.length)%p.tracks.length)}
function togglePlay(){if(index<0){if(current().tracks.length)playAt(0);else say('Добавьте файлы в плейлист');return}if(audio.paused){audio.play();$('#play').textContent='Ⅱ';$('#bottomPlay').textContent='Ⅱ'}else{audio.pause();$('#play').textContent='▶';$('#bottomPlay').textContent='▶'}}
$('#leftBtn').onclick=()=>navigate('management');$('#rightBtn').onclick=()=>navigate('files');$('#newPlaylist').onclick=()=>{$('#dialogHeading').textContent='Создать плейлист';$('#dialogInput').value='';$('#dialog').classList.add('open');$('#dialogConfirm').onclick=()=>{const n=$('#dialogInput').value.trim();if(n){playlists.push({name:n,tracks:[]});selected=playlists.length-1;renderManagement();renderFiles();$('#dialog').classList.remove('open');say('Плейлист создан')}}};$('#dialogCancel').onclick=()=>$('#dialog').classList.remove('open');$('#addFiles').onclick=()=>$('#audioFiles').click();$('#audioFiles').onchange=e=>addFiles(e.target.files);$('#folderFiles').onchange=e=>addFiles(e.target.files);$('#trackSearch').oninput=renderFiles;$('#sort').onclick=()=>{sortMode=sortMode==='title'?'random':'title';$('#sort').textContent=`Сортировка: ${sortMode==='title'?'название':'случайно'}`;renderFiles()};$('#group').onclick=()=>{grouped=!grouped;say(grouped?'Группировка по альбомам включена':'Группировка выключена')};$('#shufflePlay').onclick=()=>{shuffle=true;const p=current();if(p.tracks.length)playAt(Math.floor(Math.random()*p.tracks.length));say('Случайное воспроизведение')};$('#play').onclick=togglePlay;$('#bottomPlay').onclick=togglePlay;$('#previous').onclick=prev;$('#bottomPrev').onclick=prev;$('#next').onclick=next;$('#bottomNext').onclick=next;$('#rewind').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-10);$('#forward').onclick=()=>audio.currentTime=Math.min(audio.duration||0,audio.currentTime+10);audio.onended=next;audio.ontimeupdate=()=>{$('#elapsed').textContent=fmt(audio.currentTime);$('#total').textContent=fmt(audio.duration);$('#seek i').style.width=audio.duration?`${audio.currentTime/audio.duration*100}%`:'0%';if(abEnd&&audio.currentTime>=abEnd)audio.currentTime=abStart||0};audio.onloadedmetadata=()=>{if(index>=0){current().tracks[index].duration=audio.duration;renderFiles()}};$('#seek').onclick=e=>{if(audio.duration)audio.currentTime=e.offsetX/e.currentTarget.clientWidth*audio.duration};$('#volume').oninput=e=>{$('#volumeText').textContent=`${e.target.value}%`;$('#bottomVolume').value=e.target.value;audio.volume=e.target.value/100};$('#bottomVolume').oninput=e=>{$('#volume').value=e.target.value;$('#volume').dispatchEvent(new Event('input'))};$('#shuffle').onclick=()=>{$('#shuffle').classList.toggle('active');shuffle=!shuffle;say(shuffle?'Перемешивание включено':'Перемешивание выключено')};$('#repeat').onclick=()=>{repeat=repeat==='off'?'track':repeat==='track'?'playlist':'off';$('#repeat').classList.toggle('active',repeat!=='off');say(`Повтор: ${repeat==='off'?'выключен':repeat==='track'?'трека':'плейлиста'}`)};$('#favorite').onclick=()=>say('Трек добавлен в избранное');$('#bookmark').onclick=()=>say('Закладка сохранена');$('#ab').onclick=()=>{if(abStart===null){abStart=audio.currentTime;say('Точка A установлена')}else if(abEnd===null){abEnd=audio.currentTime;say('Точка B установлена')}else{abStart=abEnd=null;say('A/B повтор сброшен')}};$('#speed').onclick=()=>{audio.playbackRate=audio.playbackRate>=2?0.5:audio.playbackRate+0.25;$('#speed').textContent=`${audio.playbackRate}×`;say('Скорость изменена')};$('#pitch').onclick=()=>say('Управление тоном доступно в настройках аудио');$('#eq').onclick=()=>navigate('management');$('#sleep').onclick=()=>say('Таймер сна: выберите время в настройках');$('#queue').onclick=()=>navigate('files');$('#artButton').onclick=()=>say('Источник обложки: теги → папка → интернет');$('#playerMenu').onclick=()=>say('Меню: информация · поделиться · отправить в плейлист');
